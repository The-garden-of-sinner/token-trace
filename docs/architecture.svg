<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Token 轨迹架构图：只读数据源经过数据层、计算层，分别到 HTML 渲染层与 JSON API 层，最终每请求只返回一屏">
  <title>Token 轨迹 · 架构</title>
  <desc>两个只读数据源汇入数据层，派生索引供计算层使用，再分别渲染成一屏 HTML 或一条 JSON。</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arw" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2328}
    .sub{fill:#57606a}
    .bg{fill:#ffffff}
    .line{stroke:#8c959f;fill:none;stroke-width:1.6}
    .edge{stroke:#d0d7de}
    .blue{fill:#ddf4ff;stroke:#0969da}
    .purple{fill:#f3f0ff;stroke:#8250df}
    .amber{fill:#fff8e6;stroke:#bf8700}
    .green{fill:#eafaf1;stroke:#1a7f37}
    .red{fill:#fff1f0;stroke:#cf222e}
    .pill{fill:#ffffff;stroke:#d0d7de}
    .term{fill:#f6f8fa;stroke:#57606a}
    .arw{fill:#8c959f}
    .h1{font-size:22px;font-weight:700}
    .h2{font-size:16px;font-weight:700}
    .b{font-size:14px;font-weight:600}
    .n{font-size:13px}
    .s{font-size:12px}
    .xs{font-size:11px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .t{fill:#e6edf3}
      .sub{fill:#8b949e}
      .line{stroke:#6e7681}
      .edge{stroke:#30363d}
      .arw{fill:#6e7681}
      .blue{fill:#0c2d6b;stroke:#58a6ff}
      .purple{fill:#2b1d52;stroke:#bc8cff}
      .amber{fill:#3b2f0b;stroke:#d29922}
      .green{fill:#0f3d24;stroke:#3fb950}
      .red{fill:#4a1414;stroke:#f85149}
      .pill{fill:#161b22;stroke:#30363d}
      .term{fill:#161b22;stroke:#6e7681}
    }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="700"/>
  <text class="t h1" x="40" y="38">Token 轨迹 · 架构</text>
  <text class="t sub s" x="40" y="59">只读数据源 → 后端算完 → 每请求只返回一屏</text>
  <rect class="term" x="760" y="20" width="200" height="28" rx="14" stroke-width="1"/>
  <text class="t sub xs" x="860" y="38" text-anchor="middle">零 JS · 零写盘 · 纯标准库</text>
  <path class="line" d="M40 70 H960" stroke-width="1" opacity=".45"/>

  <!-- 数据源 -->
  <rect class="blue" x="60" y="88" width="410" height="74" rx="10" stroke-width="1.5"/>
  <text class="t b" x="80" y="116">会话记录  projects/**/*.jsonl</text>
  <text class="t sub s" x="80" y="139">消息 / 工具调用 / rawUsage（token · 积分）</text>
  <rect class="pill" x="404" y="98" width="50" height="21" rx="10" stroke-width="1"/>
  <text class="t sub xs" x="429" y="112" text-anchor="middle">只读</text>

  <rect class="blue" x="530" y="88" width="410" height="74" rx="10" stroke-width="1.5"/>
  <text class="t b" x="550" y="116">workbuddy.db · sessions</text>
  <text class="t sub s" x="550" y="139">cwd / 标题 / 模型名（sqlite mode=ro）</text>
  <rect class="pill" x="874" y="98" width="50" height="21" rx="10" stroke-width="1"/>
  <text class="t sub xs" x="899" y="112" text-anchor="middle">只读</text>

  <path class="line" d="M265 162 V190" marker-end="url(#arw)"/>
  <path class="line" d="M735 162 V190" marker-end="url(#arw)"/>
  <text class="t sub xs" x="500" y="180" text-anchor="middle">不写回 · 不复制一份数据</text>

  <!-- 数据层 -->
  <rect class="purple" x="60" y="194" width="880" height="114" rx="12" stroke-width="1.5"/>
  <text class="t h2" x="84" y="222">① 数据层   gen_trace.build(path, full=True) + Store(LRU 32)</text>
  <rect class="pill" x="84" y="236" width="264" height="54" rx="8" stroke-width="1"/>
  <text class="t n" x="216" y="258" text-anchor="middle">全文常驻 · 每块一个 URL</text>
  <text class="t sub xs" x="216" y="277" text-anchor="middle">12 000 字/片，原文一字不丢</text>
  <rect class="pill" x="368" y="236" width="264" height="54" rx="8" stroke-width="1"/>
  <text class="t n" x="500" y="258" text-anchor="middle">pref[] · ctxns[] · vfs[]</text>
  <text class="t sub xs" x="500" y="277" text-anchor="middle">O(1) 求可见区间字数</text>
  <rect class="pill" x="652" y="236" width="264" height="54" rx="8" stroke-width="1"/>
  <text class="t n" x="784" y="258" text-anchor="middle">acc[k] · cold · compacts</text>
  <text class="t sub xs" x="784" y="277" text-anchor="middle">压缩感知 [vf, ctxN)</text>

  <path class="line" d="M500 308 V336" marker-end="url(#arw)"/>
  <text class="t sub xs" x="516" y="326">一次解析，派生索引一次算好</text>

  <!-- 计算层 -->
  <rect class="amber" x="60" y="340" width="880" height="112" rx="12" stroke-width="1.5"/>
  <text class="t h2" x="84" y="368">② 计算层   重活全在后端，不把上下文展开到页面</text>
  <g class="pill" stroke-width="1">
    <rect x="84" y="380" width="200" height="28" rx="14"/>
    <rect x="296" y="380" width="200" height="28" rx="14"/>
    <rect x="508" y="380" width="200" height="28" rx="14"/>
    <rect x="720" y="380" width="200" height="28" rx="14"/>
    <rect x="84" y="414" width="200" height="28" rx="14"/>
    <rect x="296" y="414" width="200" height="28" rx="14"/>
    <rect x="508" y="414" width="200" height="28" rx="14"/>
    <rect x="720" y="414" width="200" height="28" rx="14"/>
  </g>
  <g class="t s" text-anchor="middle">
    <text x="184" y="399">call_state · O(1)</text>
    <text x="396" y="399">call_outline</text>
    <text x="608" y="399">block_users · 二分</text>
    <text x="820" y="399">find_blocks · search</text>
    <text x="184" y="433">trend_rows · 前缀和</text>
    <text x="396" y="433">tool_stats · prog_of</text>
    <text x="608" y="433">compact_rows</text>
    <text x="820" y="433">clamp_p · pager</text>
  </g>

  <!-- 分叉 -->
  <path class="line" d="M500 452 V470 H270 V490" marker-end="url(#arw)"/>
  <path class="line" d="M500 452 V470 H730 V490" marker-end="url(#arw)"/>

  <!-- 渲染层 / API 层 -->
  <rect class="green" x="60" y="494" width="420" height="108" rx="12" stroke-width="1.5"/>
  <text class="t h2" x="84" y="522">③ HTML 渲染层</text>
  <text class="t sub s" x="84" y="545">page() 统一外壳 · 面包屑 · 状态 chip</text>
  <text class="t sub s" x="84" y="565">每页只渲染一屏（10–53 KB）</text>
  <text class="t sub s" x="84" y="585">零 &lt;script&gt;；&lt;a href&gt; + 原生 &lt;details&gt;</text>

  <rect class="red" x="520" y="494" width="420" height="108" rx="12" stroke-width="1.5"/>
  <text class="t h2" x="544" y="522">③ JSON API 层</text>
  <text class="t sub s" x="544" y="545">17 个端点 · 统一 {ok, data, meta}</text>
  <text class="t sub s" x="544" y="565">offset/limit 分页 · Range 语义</text>
  <text class="t sub s" x="544" y="585">/api 文档由 ROUTE_SPEC 生成</text>

  <path class="line" d="M270 602 V620 H500 V632" marker-end="url(#arw)"/>
  <path class="line" d="M730 602 V620 H500 V632" marker-end="url(#arw)"/>

  <rect class="term" x="280" y="636" width="440" height="36" rx="18" stroke-width="1.2"/>
  <text class="t b" x="500" y="659" text-anchor="middle">浏览器（零 JS / 零构建） · 脚本 curl</text>
  <text class="t sub xs" x="500" y="690" text-anchor="middle">一次请求 = 一屏　|　运行期 0 字节写盘　|　Python 3.8+ 标准库　|　默认 127.0.0.1:8765</text>
</svg>
