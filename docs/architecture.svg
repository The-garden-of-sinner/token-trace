<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="Token 轨迹架构图：四个只读数据源经 bridge 归一，进入数据层与计算层，最后渲染成一屏 HTML 或一条 JSON">
  <title>Token 轨迹 · 架构</title>
  <desc>WorkBuddy / Codex / ZCode / DSH 四个只读数据源经 sources/bridge.py 归一到同一套块与调用模型，由数据层与计算层处理后，每请求只返回一屏 HTML 或一条 JSON。</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arw" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1f2328}
    .sub{fill:#57606a}
    .bg{fill:#ffffff}
    .line{stroke:#8c959f;fill:none;stroke-width:1.6}
    .edge{stroke:#d0d7de}
    .blue{fill:#ddf4ff;stroke:#0969da}
    .purple{fill:#f3f0ff;stroke:#8250df}
    .amber{fill:#fff8e6;stroke:#bf8700}
    .green{fill:#eafaf1;stroke:#1a7f37}
    .red{fill:#fff1f0;stroke:#cf222e}
    .pill{fill:#ffffff;stroke:#d0d7de}
    .term{fill:#f6f8fa;stroke:#57606a}
    .arw{fill:#8c959f}
    .h1{font-size:22px;font-weight:700}
    .h2{font-size:15px;font-weight:700}
    .b{font-size:13px;font-weight:600}
    .n{font-size:12.5px}
    .s{font-size:12px}
    .xs{font-size:10.5px}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .t{fill:#e6edf3}
      .sub{fill:#8b949e}
      .line{stroke:#6e7681}
      .edge{stroke:#30363d}
      .arw{fill:#6e7681}
      .blue{fill:#0c2d6b;stroke:#58a6ff}
      .purple{fill:#2b1d52;stroke:#bc8cff}
      .amber{fill:#3b2f0b;stroke:#d29922}
      .green{fill:#0f3d24;stroke:#3fb950}
      .red{fill:#4a1414;stroke:#f85149}
      .pill{fill:#161b22;stroke:#30363d}
      .term{fill:#161b22;stroke:#6e7681}
    }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="660"/>
  <text class="t h1" x="40" y="38">Token 轨迹 · 架构</text>
  <text class="t sub s" x="40" y="60">四个只读数据源 → 统一成块与调用 → 每请求只返回一屏</text>
  <rect class="term" x="742" y="20" width="218" height="28" rx="14" stroke-width="1"/>
  <text class="t sub xs" x="851" y="38" text-anchor="middle">零 JS · 零第三方包 · 零写盘</text>
  <path class="line" d="M40 72 H960" stroke-width="1" opacity=".45"/>

  <!-- 数据源 -->
  <text class="t sub xs" x="60" y="94">数据源（只读）</text>
  <text class="t sub xs" x="960" y="94" text-anchor="end">路径可用环境变量覆盖；单源不可用只跳过该源</text>

  <rect class="blue" x="60" y="102" width="204" height="80" rx="10" stroke-width="1.5"/>
  <text class="t b" x="74" y="126">WorkBuddy</text>
  <text class="t sub xs mono" x="74" y="146">projects/**/*.jsonl</text>
  <text class="t sub xs mono" x="74" y="162">+ workbuddy.db</text>
  <text class="t sub xs" x="74" y="176">token · 积分 · 上下文块</text>

  <rect class="blue" x="292" y="102" width="204" height="80" rx="10" stroke-width="1.5"/>
  <text class="t b" x="306" y="126">Codex</text>
  <text class="t sub xs mono" x="306" y="146">sessions/**/rollout-*</text>
  <text class="t sub xs mono" x="306" y="162">.jsonl / .jsonl.zst</text>
  <text class="t sub xs" x="306" y="176">token · 工具 · 轮次</text>

  <rect class="blue" x="524" y="102" width="204" height="80" rx="10" stroke-width="1.5"/>
  <text class="t b" x="538" y="126">ZCode</text>
  <text class="t sub xs mono" x="538" y="146">cli/db/db.sqlite</text>
  <text class="t sub xs mono" x="538" y="162">+ model-io-*.jsonl</text>
  <text class="t sub xs" x="538" y="176">token · 工具 · 会话</text>

  <rect class="blue" x="756" y="102" width="204" height="80" rx="10" stroke-width="1.5"/>
  <text class="t b" x="770" y="126">DSH</text>
  <text class="t sub xs mono" x="770" y="146">sessions/**/session.v4</text>
  <text class="t sub xs mono" x="770" y="162">.jsonl.zstd（多帧）</text>
  <text class="t sub xs" x="770" y="176">usage · 事件流</text>

  <!-- 汇入 bridge -->
  <path class="line" d="M162 182 V200 H500" marker-end="url(#arw)"/>
  <path class="line" d="M394 182 V200 H500" marker-end="url(#arw)"/>
  <path class="line" d="M626 182 V200 H500" marker-end="url(#arw)"/>
  <path class="line" d="M858 182 V200 H500" marker-end="url(#arw)"/>

  <rect class="pill" x="60" y="204" width="900" height="54" rx="10" stroke-width="1.4"/>
  <text class="t b" x="78" y="226">sources/bridge.py　统一入口</text>
  <text class="t sub s" x="78" y="245">scan_all() 合并四源摘要 · build(&lt;src&gt;://&lt;sid&gt;) 分发 · 下游统计 / 检索 / 路由不关心原始格式</text>
  <text class="t sub xs" x="942" y="245" text-anchor="end">zstd 走 ctypes</text>

  <path class="line" d="M500 258 V282" marker-end="url(#arw)"/>
  <text class="t sub xs" x="516" y="276">归一成同一套 ctx[] / calls[]</text>

  <!-- 数据层 -->
  <rect class="purple" x="60" y="286" width="900" height="100" rx="12" stroke-width="1.5"/>
  <text class="t h2" x="80" y="312">① 数据层　build(path) 重建块序列 + Store 常驻</text>
  <rect class="pill" x="80" y="324" width="264" height="50" rx="8" stroke-width="1"/>
  <text class="t n" x="212" y="345" text-anchor="middle">全文常驻 · 每块一个 URL</text>
  <text class="t sub xs" x="212" y="363" text-anchor="middle">12 000 字/片，原文一字不丢</text>
  <rect class="pill" x="362" y="324" width="264" height="50" rx="8" stroke-width="1"/>
  <text class="t n" x="494" y="345" text-anchor="middle">pref[] · ctxns[] · vfs[]</text>
  <text class="t sub xs" x="494" y="363" text-anchor="middle">O(1) 求可见区间字数</text>
  <rect class="pill" x="644" y="324" width="300" height="50" rx="8" stroke-width="1"/>
  <text class="t n" x="794" y="345" text-anchor="middle">acc[k] · cold · compacts</text>
  <text class="t sub xs" x="794" y="363" text-anchor="middle">压缩感知 [vf, ctxN)，只算真带上的块</text>

  <path class="line" d="M500 386 V410" marker-end="url(#arw)"/>
  <text class="t sub xs" x="516" y="404">一次解析，派生索引一次算好</text>

  <!-- 计算层 -->
  <rect class="amber" x="60" y="414" width="900" height="96" rx="12" stroke-width="1.5"/>
  <text class="t h2" x="80" y="440">② 计算层　重活全在后端，不把上下文展开到页面</text>
  <g class="pill" stroke-width="1">
    <rect x="80" y="450" width="206" height="24" rx="12"/>
    <rect x="298" y="450" width="206" height="24" rx="12"/>
    <rect x="516" y="450" width="206" height="24" rx="12"/>
    <rect x="734" y="450" width="206" height="24" rx="12"/>
    <rect x="80" y="478" width="206" height="24" rx="12"/>
    <rect x="298" y="478" width="206" height="24" rx="12"/>
    <rect x="516" y="478" width="206" height="24" rx="12"/>
    <rect x="734" y="478" width="206" height="24" rx="12"/>
  </g>
  <g class="t s" text-anchor="middle">
    <text x="183" y="466">call_state · O(1)</text>
    <text x="401" y="466">call_outline</text>
    <text x="619" y="466">block_users · 二分</text>
    <text x="837" y="466">find_blocks · search</text>
    <text x="183" y="494">trend_rows · 前缀和</text>
    <text x="401" y="494">tool_stats · prog_of</text>
    <text x="619" y="494">compact_rows</text>
    <text x="837" y="494">clamp_p · pager</text>
  </g>

  <!-- 分叉 -->
  <path class="line" d="M500 510 V528 H270 V546" marker-end="url(#arw)"/>
  <path class="line" d="M500 510 V528 H730 V546" marker-end="url(#arw)"/>

  <!-- 渲染层 / API 层 -->
  <rect class="green" x="60" y="550" width="420" height="86" rx="12" stroke-width="1.5"/>
  <text class="t h2" x="80" y="576">③ HTML 渲染层</text>
  <text class="t sub s" x="80" y="596">page() 统一外壳 · 按页注入 CSS · 面包屑</text>
  <text class="t sub s" x="80" y="614">每页一屏 10–65 KB　&lt;a href&gt; + 原生 &lt;details&gt;</text>

  <rect class="red" x="540" y="550" width="420" height="86" rx="12" stroke-width="1.5"/>
  <text class="t h2" x="560" y="576">③ JSON API 层</text>
  <text class="t sub s" x="560" y="596">18 个端点 · 统一 {ok, data, meta}</text>
  <text class="t sub s" x="560" y="614">offset/limit 分页 · /api 文档由 ROUTE_SPEC 生成</text>

  <text class="t sub xs" x="500" y="652" text-anchor="middle">浏览器只拿一屏：0 个 &lt;script&gt;、0 个外链、禁用脚本照样能用　|　运行期 0 字节写盘　|　Python 3.8+ 标准库</text>
</svg>
